name: build

on:
  push:
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile protocol tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -IFirmware/shared/protocol \
            Firmware/shared/protocol/bridge_protocol.c \
            Firmware/tests/protocol_test.c \
            -o protocol_test

      - name: Run protocol tests
        run: ./protocol_test

      - name: Compile Modbus tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -IFirmware/stm32/Core/Inc \
            Firmware/stm32/Core/Src/modbus_rtu.c \
            Firmware/tests/modbus_test.c \
            -o modbus_test

      - name: Run Modbus tests
        run: ./modbus_test

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate development TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout Firmware/esp32/main/certs/serverkey.pem \
            -out Firmware/esp32/main/certs/servercert.pem \
            -days 1 \
            -subj "/CN=industrial-controller.local" \
            -addext "subjectAltName=DNS:industrial-controller.local"

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: Firmware/esp32
